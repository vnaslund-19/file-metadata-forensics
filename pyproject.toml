[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "file-metadata-forensics"
dynamic = ["version"]
description = "Extract metadata from Office documents, PDFs, emails and images for forensic analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=4.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Only needed to regenerate samples/generated/ and to compare with olevba.
dev = [
    "python-docx",
    "openpyxl",
    "python-pptx",
    "oletools",
]

[project.scripts]
extract-metadata = "metadata_forensics.cli:main"

[tool.setuptools]
packages = ["metadata_forensics"]

[tool.setuptools.dynamic]
version = { attr = "metadata_forensics.__version__" }
